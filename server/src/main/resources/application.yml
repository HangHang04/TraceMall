spring:
  application:
    name: tracemall-server
  profiles:
    active: dev
  datasource:
    url: ${TRACE_DB_URL:jdbc:mysql://localhost:3308/tracemall?createDatabaseIfNotExist=true&useUnicode=true&characterEncoding=utf8&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai}
    username: ${TRACE_DB_USERNAME:root}
    password: ${TRACE_DB_PASSWORD:123456}
    driver-class-name: com.mysql.cj.jdbc.Driver
  data:
    redis:
      host: ${TRACE_REDIS_HOST:localhost}
      port: ${TRACE_REDIS_PORT:6379}
      password: ${TRACE_REDIS_PASSWORD:}
      timeout: 5s
  flyway:
    enabled: true
    locations: classpath:db/migration
  jackson:
    time-zone: Asia/Shanghai
    serialization:
      write-dates-as-timestamps: false

mybatis:
  configuration:
    map-underscore-to-camel-case: true
  type-aliases-package: com.zzx.server

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html

management:
  endpoints:
    web:
      exposure:
        include: health,info

server:
  port: ${TRACE_SERVER_PORT:18081}

trace:
  jwt:
    secret: ${TRACE_JWT_SECRET:TraceMallJwtSecretTraceMallJwtSecret2026}
    expire-minutes: ${TRACE_JWT_EXPIRE_MINUTES:240}
  sign:
    key: ${TRACE_SIGN_KEY:TRACE_SIGN_KEY_2026}
